name: aurya
description: Primeira versão de desenvolvimento AURYA. Sem serviços reais.
publish_to: none
version: 0.5.0+5
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.8.1
  flutter_tts: 4.2.5
  app_links: 7.2.2
  shared_preferences: 2.5.6
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/content.json
    - assets/audio_catalog.json
    - assets/audio/
    - assets/journey.json
    - assets/locales/
